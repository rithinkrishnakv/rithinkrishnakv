<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 286" width="700" height="286" role="img" aria-label="Security interests">
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cursor{animation:blink 1s step-start infinite}
]]></style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0d1420"/><stop offset="100%" stop-color="#080c14"/>
</linearGradient>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#00d9ff;#a78bfa" dur="10s" repeatCount="indefinite"/></stop>
<stop offset="100%" stop-color="#00d9ff"><animate attributeName="stop-color" values="#00d9ff;#a78bfa;#00d9ff" dur="10s" repeatCount="indefinite"/></stop>
</linearGradient>
<clipPath id="prompt"><rect x="44" y="50" width="0" height="26"><animate attributeName="width" from="0" to="260" dur=".5s" begin=".3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/></rect></clipPath>
</defs>

<rect width="700" height="286" rx="16" fill="url(#bg)"/>
<rect width="700" height="286" rx="16" fill="none" stroke="url(#border)" stroke-width="1.6"/>

<circle cx="30" cy="24" r="3" fill="#3d5872"/>
<circle cx="42" cy="24" r="3" fill="#516781"/>
<circle cx="54" cy="24" r="3" fill="#7dd3fc"/>
<text x="70" y="28" font-size="10.5" fill="#3d5872" letter-spacing="1">rimu@kali: ~/interests.sh</text>
<path d="M20 38 H680" stroke="#173350" stroke-width="1"/>

<g clip-path="url(#prompt)"><text x="46" y="68" font-size="15" fill="#3d5872">$ cat <tspan fill="#7dd3fc">interests.txt</tspan></text></g>
<rect class="cursor" x="198" y="53" width="8" height="17" fill="#00d9ff" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".01s" begin=".8s" fill="freeze"/></rect>

<g opacity="0" style="animation:slideIn .55s cubic-bezier(.2,.8,.3,1) 1.00s forwards">
<text x="46" y="96" font-size="16" font-weight="600" fill="#e8edf5">🛡️&#160;&#160;<tspan fill="#dbe7f2">Offensive Security &amp; Penetration Testing</tspan></text>
<circle cx="28" cy="91" r="2.2" fill="#00d9ff" opacity=".8"/>
</g><g opacity="0" style="animation:slideIn .55s cubic-bezier(.2,.8,.3,1) 1.28s forwards">
<text x="46" y="130" font-size="16" font-weight="600" fill="#e8edf5">🔍&#160;&#160;<tspan fill="#dbe7f2">Vulnerability Assessment &amp; Exploitation</tspan></text>
<circle cx="28" cy="125" r="2.2" fill="#00d9ff" opacity=".8"/>
</g><g opacity="0" style="animation:slideIn .55s cubic-bezier(.2,.8,.3,1) 1.56s forwards">
<text x="46" y="164" font-size="16" font-weight="600" fill="#e8edf5">🧠&#160;&#160;<tspan fill="#dbe7f2">CTF Challenges &amp; Security Research</tspan></text>
<circle cx="28" cy="159" r="2.2" fill="#00d9ff" opacity=".8"/>
</g><g opacity="0" style="animation:slideIn .55s cubic-bezier(.2,.8,.3,1) 1.84s forwards">
<text x="46" y="198" font-size="16" font-weight="600" fill="#e8edf5">🐧&#160;&#160;<tspan fill="#dbe7f2">Linux Systems &amp; Hardening</tspan></text>
<circle cx="28" cy="193" r="2.2" fill="#00d9ff" opacity=".8"/>
</g><g opacity="0" style="animation:slideIn .55s cubic-bezier(.2,.8,.3,1) 2.12s forwards">
<text x="46" y="232" font-size="16" font-weight="600" fill="#e8edf5">📝&#160;&#160;<tspan fill="#dbe7f2">Writing Security Walkthroughs on Medium</tspan></text>
<circle cx="28" cy="227" r="2.2" fill="#00d9ff" opacity=".8"/>
</g>
</svg>