name: Update Cyber Daily Brief

# Generates the compact "CYBER // DAILY" card once a day from free/public
# sources (CISA KEV, CISA advisories RSS, arXiv cs.CR RSS, GitHub search) —
# see scripts/generate_cyberdaily.py for the source list and reasoning.
# No LLM and no paid API is used anywhere in this pipeline.
#
# Two things get published on every successful run:
#   - cyberdaily.svg                -> committed to the `output` branch
#   - archive/cyberdaily.jsonl      -> committed to `main` (rolling log)
#
# This workflow publishes to BOTH `output` (cyberdaily.svg) and `main`
# (the archive), and update-dashboard.yml also publishes to `output`. All
# of that shares the `profile-automation-publish` concurrency group below
# rather than relying on "surgical commits" to avoid collisions — two runs
# checking out the same branch and pushing independently can race each
# other's push no matter how disjoint their file changes are. Because the
# group is applied at the workflow level, it covers this entire run start
# to finish, so the main-branch archive commit below is serialized against
# other runs too, not just the output-branch publish step.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  # Shared with update-dashboard.yml on purpose. This gates the ENTIRE run
  # of whichever workflow triggers, not just one step — so the main-branch
  # archive commit later in THIS job is covered by the same lock as the
  # output-branch publish step, without needing a second concurrency group.
  # cancel-in-progress: false means a second run QUEUES behind the first
  # instead of canceling it, so an archive update never gets silently
  # dropped because another run started first.
  #
  # Any future workflow that pushes to `output` OR to `main` in this repo
  # must join this same group, or it reintroduces exactly the race this
  # was added to close.
  group: profile-automation-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main (scripts + archive)
        # Explicit ref, deliberately not left to default to github.ref: a
        # workflow_dispatch can be run against any branch, and this
        # workflow must always read/publish from the real main branch, not
        # whatever branch happened to be selected for a manual run.
        uses: actions/checkout@v6
        with:
          ref: main
          path: main

      - name: Checkout output branch (publish target)
        uses: actions/checkout@v6
        with:
          ref: output
          path: output

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Diagnostics — before generation
        run: |
          echo "workflow triggered from ref: ${{ github.ref_name }} (event: ${{ github.event_name }})"
          echo "main checkout is pinned to:  main @ $(git -C main rev-parse HEAD)"
          echo "output checkout is pinned to: output @ $(git -C output rev-parse HEAD)"

      - name: Generate Cyber Daily brief
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 main/scripts/generate_cyberdaily.py \
            --svg output/cyberdaily.svg \
            --archive main/archive/cyberdaily.jsonl

      - name: Validate generated SVG
        run: |
          set -e
          FILE=output/cyberdaily.svg
          if [ ! -f "$FILE" ]; then
            echo "::error::cyberdaily.svg was not created"
            exit 1
          fi
          SIZE=$(wc -c < "$FILE")
          if [ "$SIZE" -lt 200 ]; then
            echo "::error::cyberdaily.svg is too small ($SIZE bytes)"
            exit 1
          fi
          # Must look like SVG/XML
          if ! head -c 200 "$FILE" | grep -qE '<svg|<\?xml'; then
            echo "::error::cyberdaily.svg does not look like valid SVG/XML"
            exit 1
          fi
          echo "OK: $FILE ($SIZE bytes)"

      - name: Publish brief to output branch
        working-directory: output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BEFORE_SHA=$(git rev-parse HEAD)
          git add cyberdaily.svg
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit (before/after SHA both $BEFORE_SHA)."
          else
            git commit -m "chore: cyber daily brief $(date -u +%F)"
            git push
            echo "output branch: $BEFORE_SHA -> $(git rev-parse HEAD)"
          fi

      - name: Commit archive to main branch
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BEFORE_SHA=$(git rev-parse HEAD)
          git add archive/cyberdaily.jsonl
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit (before/after SHA both $BEFORE_SHA)."
          else
            git commit -m "chore: archive cyber daily brief $(date -u +%F)"
            git push
            echo "main branch: $BEFORE_SHA -> $(git rev-parse HEAD)"
          fi
