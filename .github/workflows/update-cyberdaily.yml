name: Update Cyber Daily Brief

# Generates the compact "CYBER // DAILY" card once a day from free/public
# sources (CISA KEV, CISA advisories RSS, arXiv cs.CR RSS, GitHub search) —
# see scripts/generate_cyberdaily.py for the source list and reasoning.
# No LLM and no paid API is used anywhere in this pipeline.
#
# Two things get published on every successful run:
#   - cyberdaily.svg                -> committed to the `output` branch
#   - archive/cyberdaily.jsonl      -> committed to `main` (rolling log)
#
# This workflow and update-dashboard.yml both publish to the `output`
# branch, so they share the `output-branch-publish` concurrency group below
# rather than relying on "surgical commits" to avoid collisions — two jobs
# checking out the same branch and pushing independently can race each
# other's push no matter how disjoint their file changes are. Sharing a
# concurrency group makes GitHub Actions queue them instead of racing.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: output-branch-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main (scripts + archive)
        uses: actions/checkout@v6
        with:
          path: main

      - name: Checkout output branch (publish target)
        uses: actions/checkout@v6
        with:
          ref: output
          path: output

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Diagnostics — before generation
        run: |
          echo "main branch:   ${{ github.ref_name }} @ $(git -C main rev-parse HEAD)"
          echo "output branch: output @ $(git -C output rev-parse HEAD)"

      - name: Generate Cyber Daily brief
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 main/scripts/generate_cyberdaily.py \
            --svg output/cyberdaily.svg \
            --archive main/archive/cyberdaily.jsonl

      - name: Validate generated SVG
        run: |
          set -e
          FILE=output/cyberdaily.svg
          if [ ! -f "$FILE" ]; then
            echo "::error::cyberdaily.svg was not created"
            exit 1
          fi
          SIZE=$(wc -c < "$FILE")
          if [ "$SIZE" -lt 200 ]; then
            echo "::error::cyberdaily.svg is too small ($SIZE bytes)"
            exit 1
          fi
          # Must look like SVG/XML
          if ! head -c 200 "$FILE" | grep -qE '<svg|<\?xml'; then
            echo "::error::cyberdaily.svg does not look like valid SVG/XML"
            exit 1
          fi
          echo "OK: $FILE ($SIZE bytes)"

      - name: Publish brief to output branch
        working-directory: output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BEFORE_SHA=$(git rev-parse HEAD)
          git add cyberdaily.svg
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit (before/after SHA both $BEFORE_SHA)."
          else
            git commit -m "chore: cyber daily brief $(date -u +%F)"
            git push
            echo "output branch: $BEFORE_SHA -> $(git rev-parse HEAD)"
          fi

      - name: Commit archive to main branch
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BEFORE_SHA=$(git rev-parse HEAD)
          git add archive/cyberdaily.jsonl
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit (before/after SHA both $BEFORE_SHA)."
          else
            git commit -m "chore: archive cyber daily brief $(date -u +%F)"
            git push
            echo "main branch: $BEFORE_SHA -> $(git rev-parse HEAD)"
          fi
