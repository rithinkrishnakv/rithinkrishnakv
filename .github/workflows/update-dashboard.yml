name: Update Dashboard (Stats + Activity Graph)

# Regenerates the two GitHub-data-driven cards used in the README:
#   - stats.svg           (contributions/streaks/top languages)
#   - activity-graph.svg  (52-week contribution activity chart)
#
# Both are rendered by scripts/generate_stats.py from a SINGLE GitHub
# GraphQL fetch, so the two cards can never disagree with each other. There
# used to be a second, third-party-action-based workflow generating
# activity-graph.svg on the same schedule (activity-graph.yml) — it raced
# this one on every run and has been removed. This is now the one and only
# workflow that touches either file.
#
# This workflow and update-cyberdaily.yml both publish to this repo (this
# one only to `output`; update-cyberdaily.yml to `output` AND `main`), so
# they share the `profile-automation-publish` concurrency group below
# instead of relying on "surgical commits" to avoid collisions. Two runs
# cannot safely check out the same branch, edit disjoint files, and push
# independently without one of them racing the other's push — sharing a
# concurrency group makes GitHub Actions queue runs instead of racing them,
# for the whole run, not just the step that happens to touch `output`.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  # This gates the ENTIRE run (every step, start to finish) of whichever
  # workflow triggers — not just the "push to output" step. That matters
  # because update-cyberdaily.yml's run, using this same group, also
  # commits to `main` (the archive) later in its job; that main-branch
  # commit is covered by this same lock, not left to race separately.
  #
  # cancel-in-progress: false stops a second run from KILLING the one
  # currently in progress. On its own that is NOT enough: GitHub's
  # historical default only keeps one PENDING run per group — if a
  # third run shows up while a second is still waiting, that second
  # (still-pending, never-started) run is silently canceled and replaced
  # by the third, with no error and no red X. `queue: max` turns that
  # single pending slot into an ordered queue (up to 100 waiting runs)
  # so every triggered run either starts or is still waiting — never
  # silently dropped before it gets a chance to run. queue: max requires
  # cancel-in-progress: false (they describe conflicting behaviors for
  # in-progress runs, so GitHub rejects the two together).
  #
  # Any future workflow that pushes to `output` OR to `main` in this repo
  # must join this same group, or it reintroduces exactly the race this
  # was added to close.
  group: profile-automation-publish
  cancel-in-progress: false
  queue: max
  # NOTE: as of actionlint v1.7.12 (2026-03-30), actionlint's schema
  # predates GitHub's 2026-05-07 rollout of `queue: max` and will flag it
  # as an "unexpected key". That is a stale-linter false positive, not a
  # workflow bug — see https://docs.github.com/actions/using-jobs/using-concurrency
  # and https://github.blog/changelog/2026-05-07-github-actions-concurrency-groups-now-allow-larger-queues/
  # Re-check when actionlint releases a version newer than 1.7.12 and
  # remove this note once it recognizes the key.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main (scripts)
        # Explicit ref, deliberately not left to default to github.ref: a
        # workflow_dispatch can be run against any branch, and this
        # workflow must always read/publish from the real main branch, not
        # whatever branch happened to be selected for a manual run.
        uses: actions/checkout@v6
        with:
          ref: main
          path: main

      - name: Checkout output branch (publish target)
        uses: actions/checkout@v6
        with:
          ref: output
          path: output

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Diagnostics — before generation
        run: |
          echo "workflow triggered from ref: ${{ github.ref_name }} (event: ${{ github.event_name }})"
          echo "main checkout is pinned to:  main @ $(git -C main rev-parse HEAD)"
          echo "output checkout is pinned to: output @ $(git -C output rev-parse HEAD)"
          echo "STATS_TOKEN secret configured: ${{ secrets.STATS_TOKEN != '' }}"
          echo "(if false, the script falls back to the default GITHUB_TOKEN — that's expected, not an error)"

      - name: Generate stats + activity graph
        # Deliberately no `continue-on-error` and no "skip if secret
        # missing" gate here — see the module docstring in generate_stats.py.
        # STATS_TOKEN is optional (the script falls back to the ambient
        # GITHUB_TOKEN, which is sufficient scope for public contribution
        # and language data). A failed run must show up as a red X in
        # Actions, never as a silently stale stats.svg/activity-graph.svg.
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USERNAME: rithinkrishnakv
        run: |
          python3 main/scripts/generate_stats.py \
            --stats-out output/stats.svg \
            --activity-out output/activity-graph.svg

      - name: Validate generated SVGs
        run: |
          set -e
          for FILE in output/stats.svg output/activity-graph.svg; do
            if [ ! -f "$FILE" ]; then
              echo "::error::$FILE was not created"
              exit 1
            fi
            SIZE=$(wc -c < "$FILE")
            if [ "$SIZE" -lt 200 ]; then
              echo "::error::$FILE is too small ($SIZE bytes)"
              exit 1
            fi
            if ! head -c 200 "$FILE" | grep -qE '<svg|<\?xml'; then
              echo "::error::$FILE does not look like valid SVG/XML"
              exit 1
            fi
            echo "OK: $FILE ($SIZE bytes)"
          done

      - name: Publish changed files to output branch
        working-directory: output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BEFORE_SHA=$(git rev-parse HEAD)
          git add stats.svg activity-graph.svg
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit (before/after SHA both $BEFORE_SHA)."
          else
            git commit -m "chore: update dashboard $(date -u +%F)"
            git push
            echo "output branch: $BEFORE_SHA -> $(git rev-parse HEAD)"
          fi
