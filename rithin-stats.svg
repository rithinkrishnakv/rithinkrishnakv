<path d="M7 0.5 C7 3 4.2 4 4.2 7.2 C4.2 9.6 6 11 7.6 11 C6.6 10 6.4 8.6 7 7.6 C7.4 8.8 8.6 9 9 10 C10.4 9 11 7.4 10.4 5.6 C10 6.4 9.4 6.6 9 6.2 C10 4.4 9 1.6 7 0.5 Z" fill="#00d9ff" opacity=".85"/>
</g>

<path d="M40 146 H660" stroke="#173350" stroke-width="1"/>
