<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 262" width="700" height="262" role="img" aria-label="Contribution activity graph">
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes drawLine{to{stroke-dashoffset:0}}
@keyframes pulseDot{0%,100%{opacity:.7;r:3.4}50%{opacity:1;r:4.6}}
.pulse{animation:pulseDot 2.4s ease-in-out infinite}
]]></style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0d1420"/><stop offset="100%" stop-color="#080c14"/>
</linearGradient>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#00d9ff"><animate attributeName="stop-color" values="#00d9ff;#a78bfa;#00d9ff" dur="10s" repeatCount="indefinite"/></stop>
<stop offset="100%" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#00d9ff;#a78bfa" dur="10s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#00d9ff" stop-opacity=".35"/>
<stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
</linearGradient>
<clipPath id="areaReveal"><rect x="50" y="60" width="0" height="170"><animate attributeName="width" from="0" to="620" dur="2.4s" begin=".5s" fill="freeze" calcMode="spline" keySplines=".25 .7 .3 1"/></rect></clipPath>
</defs>

<rect width="700" height="262" rx="16" fill="url(#bg)"/>
