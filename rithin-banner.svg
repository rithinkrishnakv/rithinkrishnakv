<circle class="node" cx="96" cy="118" r="6.5" fill="#a78bfa" stroke="none" style="animation-delay:.4s"/>

<g opacity="0" style="animation:fadeIn .8s ease 4.2s forwards">
<path d="M0 182 H330" stroke="#173350" stroke-width="1"/>
<text x="0" y="200" font-size="10.5" letter-spacing="1.5" fill="#3d5872">LIVE TELEMETRY // SECURITY NODE</text>
<path d="M0 214 L18 214 L24 226 L32 202 L40 220 L48 214 L66 214" fill="none" stroke="#00d9ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="210" y="218" font-size="10" letter-spacing="1" fill="#5b6b84">STATUS:</text>
<text x="318" y="218" font-size="10" letter-spacing="1" fill="#00d9ff" text-anchor="end">ONLINE</text>
<circle cx="326" cy="215" r="3" fill="#00d9ff" class="node" style="animation-delay:.9s"/>
</g>
</g>

<!-- ambient scanline -->
<g clip-path="url(#bannerClip)">
<rect x="0" y="0" width="1200" height="60" fill="url(#scanGrad)">
<animate attributeName="y" values="-60;320" dur="8s" repeatCount="indefinite"/>
</rect>
</g>

<rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.6"/>
</svg>
