<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Rithin Krishna (Rimu) - Cyber Security Enthusiast">
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes drift{0%{transform:translateY(0);opacity:0}12%{opacity:.9}88%{opacity:.9}100%{transform:translateY(-46px);opacity:0}}
@keyframes pulseNode{0%,100%{opacity:.55;r:3.2}50%{opacity:1;r:4.4}}
@keyframes ping{0%{opacity:.55;r:6}100%{opacity:0;r:22}}
@keyframes flowDash{to{stroke-dashoffset:-120}}
@keyframes glitchJitter{0%,37%,40%,73%,77%,100%{transform:translate(0,0)}38%{transform:translate(-2px,1px)}39%{transform:translate(2px,0)}75%{transform:translate(1px,-1px)}76%{transform:translate(-1px,0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.particle{animation:drift linear infinite}
.node{animation:pulseNode 3s ease-in-out infinite}
.pingring{animation:ping 2.6s cubic-bezier(.2,.7,.3,1) infinite}
.flow{stroke-dasharray:6 10;animation:flowDash 3.2s linear infinite}
.glitch{transform-box:fill-box;transform-origin:center;animation:glitchJitter 6.5s ease-in-out infinite}
.cursor{animation:blink 1s step-start infinite}
]]></style>

<linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#05070d"/>
<stop offset="55%" stop-color="#0d1b2a"/>
<stop offset="100%" stop-color="#0a0e1a"/>
</linearGradient>

<linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#00d9ff"><animate attributeName="stop-color" values="#00d9ff;#a78bfa;#38bdf8;#00d9ff" dur="10s" repeatCount="indefinite"/></stop>
<stop offset="50%" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#00d9ff;#a78bfa;#38bdf8" dur="10s" repeatCount="indefinite"/></stop>
<stop offset="100%" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#38bdf8;#00d9ff;#a78bfa" dur="10s" repeatCount="indefinite"/></stop>
</linearGradient>

<linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#00d9ff"/>
<stop offset="100%" stop-color="#8fe3ff"/>
</linearGradient>

<linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#00d9ff" stop-opacity="0"/>
<stop offset="50%" stop-color="#00d9ff" stop-opacity=".10"/>
<stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
</linearGradient>

<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
<circle cx="1.4" cy="1.4" r="1.1" fill="#38bdf8" opacity=".18"/>
</pattern>

<radialGradient id="glow1" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#0ea5e9" stop-opacity=".16"/>
<stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glow2" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#00d9ff" stop-opacity=".10"/>
<stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
</radialGradient>

<filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="3.2" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<clipPath id="bannerClip"><rect x="1" y="1" width="1198" height="318" rx="18"/></clipPath>
<clipPath id="typePrompt"><rect x="55" y="44" width="0" height="28"><animate attributeName="width" from="0" to="240" dur="1s" begin=".3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/></rect></clipPath>
<clipPath id="typeName"><rect x="53" y="80" width="0" height="80"><animate attributeName="width" from="0" to="480" dur=".85s" begin="1.3s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/></rect></clipPath>

<clipPath id="tag1"><rect x="56" y="180" width="0" height="30"><animate attributeName="width" values="0;0;320;320;0;0" keyTimes="0;.02;.09;.21;.23;1" dur="20s" begin="2.5s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="tag2"><rect x="56" y="180" width="0" height="30"><animate attributeName="width" values="0;0;320;320;0;0" keyTimes="0;.27;.34;.46;.48;1" dur="20s" begin="2.5s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="tag3"><rect x="56" y="180" width="0" height="30"><animate attributeName="width" values="0;0;320;320;0;0" keyTimes="0;.52;.59;.71;.73;1" dur="20s" begin="2.5s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="tag4"><rect x="56" y="180" width="0" height="30"><animate attributeName="width" values="0;0;320;320;0;0" keyTimes="0;.77;.84;.96;.98;1" dur="20s" begin="2.5s" repeatCount="indefinite"/></rect></clipPath>
</defs>

<rect width="1200" height="320" rx="18" fill="url(#bgGrad)"/>
<rect width="1200" height="320" rx="18" fill="url(#dots)"/>
<circle cx="150" cy="70" r="190" fill="url(#glow1)"/>
<circle cx="980" cy="190" r="240" fill="url(#glow2)"/>

<!-- HUD corner brackets -->
<g stroke="#00d9ff" stroke-width="1.6" fill="none" opacity=".5" stroke-linecap="round">
<path d="M20 34 V20 H34"/>
<path d="M1166 20 H1180 V34"/>
<path d="M20 286 V300 H34"/>
<path d="M1180 286 V300 H1166"/>
</g>

<!-- terminal titlebar -->
<g opacity=".8">
<circle cx="44" cy="27" r="3" fill="#3d5872"/>
<circle cx="57" cy="27" r="3" fill="#516781"/>
<circle cx="70" cy="27" r="3" fill="#7dd3fc"/>
<text x="90" y="31" font-size="11" fill="#3d5872" letter-spacing="1">~/whoami.sh</text>
<path d="M32 40 H420" stroke="#173350" stroke-width="1"/>
</g>

<!-- circuit traces -->
<g stroke="#173350" stroke-width="1.4" fill="none">
<path d="M0 36 H150 L172 58 V300"/>
<path d="M0 264 H86 L108 242 V150"/>
<path d="M1200 46 H1080 L1058 68 V300"/>
</g>
<g fill="#38bdf8">
<circle class="node" cx="172" cy="58" r="3.2"/>
<circle class="node" cx="108" cy="150" r="3.2" style="animation-delay:.7s"/>
<circle class="node" cx="1058" cy="68" r="3.2" style="animation-delay:1.3s"/>
</g>

<!-- floating packets -->
<g fill="#00d9ff">
<rect class="particle" x="248" y="252" width="5" height="5" transform="rotate(45 250.5 254.5)" style="animation-duration:6.2s;animation-delay:.2s"/>
<rect class="particle" x="600" y="238" width="4" height="4" transform="rotate(45 602 240)" style="animation-duration:7.1s;animation-delay:1.6s"/>
<rect class="particle" x="430" y="260" width="4" height="4" transform="rotate(45 432 262)" style="animation-duration:5.6s;animation-delay:2.4s"/>
<rect class="particle" x="960" y="256" width="5" height="5" transform="rotate(45 962.5 258.5)" style="animation-duration:6.8s;animation-delay:.9s"/>
</g>

<!-- terminal prompt -->
<g clip-path="url(#typePrompt)">
<text x="56" y="64" font-size="19" fill="#7dd3fc">rimu@kali<tspan fill="#3d5872">:~$</tspan> whoami</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.3s" dur=".01s" fill="freeze"/><rect class="cursor" x="277" y="49" width="9" height="18" fill="#00d9ff"/></g>

<!-- name (typing reveal + subtle glitch ghosts) -->
<g clip-path="url(#typeName)">
<text class="glitch" x="55" y="132" font-size="52" font-weight="700" letter-spacing="1" fill="#a78bfa" opacity=".5" style="animation-delay:.15s">RITHIN KRISHNA</text>
<text class="glitch" x="57" y="134" font-size="52" font-weight="700" letter-spacing="1" fill="#00d9ff" opacity=".4">RITHIN KRISHNA</text>
<text x="56" y="133" font-size="52" font-weight="700" letter-spacing="1" fill="url(#nameGrad)" filter="url(#softGlow)">RITHIN KRISHNA</text>
</g>

<text x="57" y="162" font-size="15" fill="#5b6b84" opacity="0" style="animation:fadeIn .6s ease 2.15s forwards">aka <tspan fill="#7dd3fc" font-weight="700">Rimu</tspan></text>

<!-- rotating role tags -->
<g fill="#e8edf5" font-size="20" font-weight="600">
<g clip-path="url(#tag1)"><text x="56" y="200"><tspan fill="#00d9ff">&gt;</tspan> Ethical Hacker</text></g>
<g clip-path="url(#tag2)"><text x="56" y="200"><tspan fill="#00d9ff">&gt;</tspan> CTF Player</text></g>
<g clip-path="url(#tag3)"><text x="56" y="200"><tspan fill="#00d9ff">&gt;</tspan> Security Researcher</text></g>
<g clip-path="url(#tag4)"><text x="56" y="200"><tspan fill="#00d9ff">&gt;</tspan> System Stabilizer</text></g>
</g>

<g opacity="0" style="animation:fadeIn .7s ease 3.3s forwards">
<text x="56" y="244" font-size="13" fill="#5b6b84">📍 Kerala, IN</text>
<text x="168" y="244" font-size="13" fill="#3d5872">status: 💀 idk what am doing</text>
</g>

<g opacity="0" style="animation:fadeIn .7s ease 3.7s forwards" font-size="13">
<g stroke="#7dd3fc" stroke-width="1.3" fill="none" stroke-linecap="round">
<circle cx="61" cy="269" r="6.5"/>
<path d="M54.5 269 H67.5 M61 262.5 C64 265.5 64 272.5 61 275.5 M61 262.5 C58 265.5 58 272.5 61 275.5"/>
</g>
<text x="74" y="273" fill="#7dd3fc">rithinkrishnakv.vercel.app</text>
<g stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round">
<path d="M270 265.5 L280 275.5 M280 265.5 L270 275.5"/>
</g>
<text x="288" y="273" fill="#a78bfa">x.com/RithinSec</text>
</g>

<!-- right-side network graph motif -->
<g transform="translate(770,44)" opacity=".85">
<g stroke="#1e4966" stroke-width="1.6" fill="none">
<path d="M34 26 L150 4"/>
<path d="M150 4 L256 54"/>
<path d="M34 26 L96 118"/>
<path d="M96 118 L214 150"/>
<path d="M214 150 L330 96"/>
<path d="M256 54 L330 96"/>
<path d="M96 118 L150 4"/>
</g>
<path class="flow" d="M34 26 L150 4" stroke="#00d9ff" stroke-width="1.8" fill="none" opacity=".8"/>
<path class="flow" d="M96 118 L214 150" stroke="#00d9ff" stroke-width="1.8" fill="none" opacity=".8" style="animation-delay:1.1s"/>

<circle class="pingring" cx="96" cy="118" r="6" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
<g fill="#0d1b2a" stroke="#38bdf8" stroke-width="1.5">
<circle cx="34" cy="26" r="5"/>
<circle cx="150" cy="4" r="5"/>
