name: Update Dashboard (Stats + Activity Graph)

# Regenerates the two GitHub-data-driven cards used in the README:
#   - stats.svg           (contributions/streaks/top languages)
#   - activity-graph.svg  (52-week contribution activity chart)
#
# Both are rendered by scripts/generate_stats.py from a SINGLE GitHub
# GraphQL fetch, so the two cards can never disagree with each other. There
# used to be a second, third-party-action-based workflow generating
# activity-graph.svg on the same schedule (activity-graph.yml) — it raced
# this one on every run and has been removed. This is now the one and only
# workflow that touches either file.
#
# This workflow and update-cyberdaily.yml both publish to the `output`
# branch, so they share the `output-branch-publish` concurrency group below
# instead of relying on "surgical commits" to avoid collisions. Two jobs
# cannot safely check out the same branch, edit disjoint files, and push
# independently without one of them racing the other's push — sharing a
# concurrency group makes GitHub Actions queue them instead of running them
# in parallel.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: output-branch-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main (scripts)
        uses: actions/checkout@v6
        with:
          path: main

      - name: Checkout output branch (publish target)
        uses: actions/checkout@v6
        with:
          ref: output
          path: output

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Diagnostics — before generation
        run: |
          echo "main branch:   ${{ github.ref_name }} @ $(git -C main rev-parse HEAD)"
          echo "output branch: output @ $(git -C output rev-parse HEAD)"
          echo "STATS_TOKEN secret configured: ${{ secrets.STATS_TOKEN != '' }}"
          echo "(if false, the script falls back to the default GITHUB_TOKEN — that's expected, not an error)"

      - name: Generate stats + activity graph
        # Deliberately no `continue-on-error` and no "skip if secret
        # missing" gate here — see the module docstring in generate_stats.py.
        # STATS_TOKEN is optional (the script falls back to the ambient
        # GITHUB_TOKEN, which is sufficient scope for public contribution
        # and language data). A failed run must show up as a red X in
        # Actions, never as a silently stale stats.svg/activity-graph.svg.
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USERNAME: rithinkrishnakv
        run: |
          python3 main/scripts/generate_stats.py \
            --stats-out output/stats.svg \
            --activity-out output/activity-graph.svg

      - name: Validate generated SVGs
        run: |
          set -e
          for FILE in output/stats.svg output/activity-graph.svg; do
            if [ ! -f "$FILE" ]; then
              echo "::error::$FILE was not created"
              exit 1
            fi
            SIZE=$(wc -c < "$FILE")
            if [ "$SIZE" -lt 200 ]; then
              echo "::error::$FILE is too small ($SIZE bytes)"
              exit 1
            fi
            if ! head -c 200 "$FILE" | grep -qE '<svg|<\?xml'; then
              echo "::error::$FILE does not look like valid SVG/XML"
              exit 1
            fi
            echo "OK: $FILE ($SIZE bytes)"
          done

      - name: Publish changed files to output branch
        working-directory: output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BEFORE_SHA=$(git rev-parse HEAD)
          git add stats.svg activity-graph.svg
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit (before/after SHA both $BEFORE_SHA)."
          else
            git commit -m "chore: update dashboard $(date -u +%F)"
            git push
            echo "output branch: $BEFORE_SHA -> $(git rev-parse HEAD)"
          fi
