<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" height="270" role="img" aria-label="GitHub contribution stats and top languages">
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes popIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
]]></style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0d1420"/><stop offset="100%" stop-color="#080c14"/>
</linearGradient>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#00d9ff"><animate attributeName="stop-color" values="#00d9ff;#a78bfa;#00d9ff" dur="10s" repeatCount="indefinite"/></stop>
<stop offset="100%" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#00d9ff;#a78bfa" dur="10s" repeatCount="indefinite"/></stop>
</linearGradient>
<clipPath id="seg0"><rect x="40.00" y="168" width="0" height="10"><animate attributeName="width" from="0" to="531.96" dur=".7s" begin="1.10s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/></rect></clipPath><clipPath id="seg1"><rect x="571.96" y="168" width="0" height="10"><animate attributeName="width" from="0" to="66.96" dur=".7s" begin="1.25s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/></rect></clipPath><clipPath id="seg2"><rect x="638.92" y="168" width="0" height="10"><animate attributeName="width" from="0" to="14.88" dur=".7s" begin="1.40s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/></rect></clipPath><clipPath id="seg3"><rect x="653.80" y="168" width="0" height="10"><animate attributeName="width" from="0" to="6.20" dur=".7s" begin="1.55s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/></rect></clipPath>
</defs>

<rect width="700" height="270" rx="16" fill="url(#bg)"/>
<rect width="700" height="270" rx="16" fill="none" stroke="url(#border)" stroke-width="1.6"/>

